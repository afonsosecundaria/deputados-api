<h1>Deputados Federais</h1>

<div class="deputados">

  @for (deputado of deputados; track deputado.id) {

    <div class="card">

      <img
        [src]="deputado.urlFoto"
        [alt]="deputado.nome"
      >

      <h2>{{ deputado.nome }}</h2>

      <p>
        Partido: {{ deputado.siglaPartido }}
      </p>

      <p>
        Estado: {{ deputado.siglaUf }}
      </p>

    </div>

  }

</div>
